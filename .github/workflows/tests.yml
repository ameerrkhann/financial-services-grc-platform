name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest on Python 3.13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # GRC_DB_PATH is set per-test by tests/conftest.py, so the suite never
        # touches src/database/grc_platform.db.
        run: pytest -v

      - name: Rebuild the demo dataset and every deliverable
        # Proves the pipeline still runs end to end, not just that the units
        # pass. MPLBACKEND=Agg keeps matplotlib headless on the runner.
        env:
          MPLBACKEND: Agg
        run: |
          python src/database/seed_demo_data.py
          python src/risk_quantification/loss_exceedance.py
          python src/compliance/csf_radar.py
          python src/reporting/export_for_powerbi.py
          python src/reporting/executive_summary.py
          python src/reporting/build_templates.py
